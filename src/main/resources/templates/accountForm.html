<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link rel="stylesheet" type="text/css" href="/css/style.css">
</head>

<body>
	<header><h1>新規ユーザー登録</h1></header> 
	
	<form action="/user/add" method="post">
		
		<div th:each="error:${errorList}">
					<span th:text="${error}" style="color: red"></span>
				</div>
		

		<table border="1">
			<tr>
				<th>お名前</th>
				<td>
					<input type="text" class="text" name="name" th:value="${name}">
				</td>
			</tr>
			<tr>
				<th>パスワード</th>
				<td>
					<input type="text" class="text" name="password">
				</td>
			</tr>
		</table>
		<button>登録</button>
	</form>
	</main>
	<footer th:replace="~{footer}"></footer>
</body>

</html>
