<div class="wrap">

	<header class="header">
		<div class="contents">
			<h1>お薬チェッカー</h1>
			<p>--- [[${@account.name}]]さんがログイン中 --- </p><br>
			<script>
				//今日の日付データを変数に格納
				//変数は"today"とする
				var today = new Date();

				//年・月・日・曜日を取得
				var year = today.getFullYear();
				var month = today.getMonth() + 1;
				var week = today.getDay();
				var day = today.getDate();

				var week_ja = new Array("日", "月", "火", "水", "木", "金", "土");

				//年・月・日・曜日を書き出す
				document.write(year + "年" + month + "月" + day + "日 " + week_ja[week] + "曜日");
			</script>


			<a href="/logout" onclick="return confirm('本当にログアウトしますか？');">ログアウト</a>
		</div>


		<form action="/manage" method="get">

			<button>薬一覧</button>
		</form>
	</header>
</div>
