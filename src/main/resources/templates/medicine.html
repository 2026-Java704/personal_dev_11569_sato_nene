<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>

<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
</head>

<body>
	<header th:replace="~{header}"></header>
	<table border="1">
		<tr>
			<th>No</th>
			<th>薬名</th>
			<th>個数</th>
			<th>飲んだかどうか</th>
			<th>備考</th>
			<th>更新</th>
			<th>削除</th>

		</tr>
		<tr th:each="medicine:${medicineList}">
			<td th:text="${medicine.id}"></td>
			<td th:text="${medicine.name}"></td>
			<td th:text="${medicine.count}"></td>
			<td>
				<input type="radio" name="doornot" value="do"> 済
				<input type="radio" name="doornot"value="not"> 未済
			</td>
			<td th:text="${medicine.note}"></td>
			<td>
				<button>更新</button>
			</td>
			<td>
				<button>削除</button>
			</td>
			
		</tr>
	</table>
				<form action="/medicine/add" method="get">

						<button>新しく薬を追加する</button>
					</form>
				
</body>

</html>
