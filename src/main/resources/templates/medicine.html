<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>

<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link rel="stylesheet" type="text/css" href="/css/style.css">
</head>

<body>
	<header th:replace="~{header}"></header>
	<table border="2">
		<tr>
			
		
			<th>チェック</th>
			<th>薬名</th>
			<th>回数</th>
			<th>備考</th>
			<th>編集</th>
			<th>削除</th>

		</tr>
		<tr th:each="medicine:${medicineList}">
		
			<td>
							<form action="/medicine/check" method="post">
								<input type="hidden" name="id" th:value="${medicine.id}">
								<input type="checkbox"  name="mcheck" th:checked="${medicine.m_check}" >済
								
								<button>完了</button>
								</form>
						</td>
			<td th:text="${medicine.name}"></td>
			<td th:text="${medicine.count}"></td>
			
			<td th:text="${medicine.note}"></td>
			<td>

					<form th:action="@{/medicine/{id}/edit(id=${medicine.id})}" method="get">
					<button>編集</button>
				</form>
			</td>
			<td>
				<form th:action="@{/medicine/{medicineId}/delete(medicineId=${medicine.id})}" method="post">
					<button>削除</button>
				</form>
			</td>
			
		</tr>
	</table>
				<form action="/medicine/add" method="get">

						<td>
							<button>追加する</button>
						</td>
					</form>
				
</body>

</html>
