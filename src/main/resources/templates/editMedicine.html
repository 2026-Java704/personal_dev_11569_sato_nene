<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>

<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link rel="stylesheet" type="text/css" href="/css/style.css">
</head>

<body>
	<header th:replace="~{header}"></header>
<!--	<h1>編集</h1>-->

	<form th:action="@{/medicine/{medicineId}/edit(medicineId=${medicine.id})}" method="post">
		
		
		<table border="1">
			<tr>
				<th>薬名</th>
				<td>
					<input type="text" name="name" th:value="${medicine.name}">
				</td>
			</tr>
			
			<tr>
				<th>回数</th>
				<td>
					<input type="text" name="count" th:value="${medicine.count}">
				</td>
			</tr>

			<tr>
				<th>備考</th>
				<td>
					<input type="text" name="note" th:value="${medicine.note}">
				</td>
			</tr>
		</table>
		<button>更新</button>
	</form>
</body>

</html>
